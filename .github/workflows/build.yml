name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Gradle wrapper
        id: wrapper
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing keystore
        id: keystore
        run: |
          if [ -f keystore/glass-launcher.keystore ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate signing keystore
        if: steps.keystore.outputs.exists == 'false'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/glass-launcher.keystore \
            -alias glasslauncher \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass glasslauncher123 -keypass glasslauncher123 \
            -dname "CN=Glass Launcher, OU=Dev, O=kerenpandi71, L=ID, ST=ID, C=ID"

      - name: Commit signing keystore
        if: steps.keystore.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/glass-launcher.keystore
          git commit -m "Add stable signing keystore" || echo "nothing to commit"
          git push

      - name: Generate Gradle wrapper
        if: steps.wrapper.outputs.exists == 'false'
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Commit Gradle wrapper
        if: steps.wrapper.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          git commit -m "Add Gradle wrapper" || echo "nothing to commit"
          git push

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
